# نشر على Render Free. تنبيه: ملفات الخادم مؤقتة في الخطة المجانية (تضيع عند إعادة التشغيل)،
# لذلك ستنتقل البيانات إلى PostgreSQL مجاني (Neon) في المرحلة التالية.
services:
  - type: web
    name: cement-world
    runtime: docker
    plan: free
    healthCheckPath: /api/catalog
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
