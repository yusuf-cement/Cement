# نشر على Render Free مع قاعدة PostgreSQL مجانية (Neon): البيانات والصور محفوظة في القاعدة،
# فلا تضيع عند إعادة تشغيل الخادم.
services:
  - type: web
    name: cement-world
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
